<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MTG Oracle — oracle eye in faceted crystal">
  <defs>
    <!-- Main crystal body: top-lit gradient -->
    <linearGradient id="a-crystal-top" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <!-- Shadowed side facets -->
    <linearGradient id="a-crystal-shade" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <!-- Upper-right highlight facet -->
    <linearGradient id="a-crystal-hl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <!-- Lower-left deep facet -->
    <linearGradient id="a-crystal-deep" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0c0a1c"/>
    </linearGradient>
    <!-- Inner atmospheric glow around the eye -->
    <radialGradient id="a-atmos" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <!-- Iris: radial bands + outer limbal ring -->
    <radialGradient id="a-iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="65%" stop-color="#b45309"/>
      <stop offset="90%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <!-- Soft glow around crystal -->
    <radialGradient id="a-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <!-- Gaussian blur for atmospheric softness -->
    <filter id="a-soften" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Outer aura halo -->
  <circle cx="32" cy="32" r="30" fill="url(#a-aura)"/>

  <!-- ─── Crystal body: 6 facets, each shaded differently for depth ─── -->
  <!-- Apex coords: top (32,4), upper-right (56,26), lower-right (48,50),
       bottom (32,60), lower-left (16,50), upper-left (8,26), center (32,32) -->

  <!-- Upper-left facet (highlight side) -->
  <path d="M32 4 L32 32 L8 26 Z" fill="url(#a-crystal-top)"/>
  <!-- Upper-right facet (brightest — main light source top-right) -->
  <path d="M32 4 L56 26 L32 32 Z" fill="url(#a-crystal-hl)"/>
  <!-- Right facet (medium) -->
  <path d="M56 26 L48 50 L32 32 Z" fill="url(#a-crystal-top)"/>
  <!-- Lower-right facet (shadowed) -->
  <path d="M48 50 L32 60 L32 32 Z" fill="url(#a-crystal-shade)"/>
  <!-- Lower-left facet (deepest shadow) -->
  <path d="M32 60 L16 50 L32 32 Z" fill="url(#a-crystal-deep)"/>
  <!-- Left facet (medium shade) -->
  <path d="M16 50 L8 26 L32 32 Z" fill="url(#a-crystal-shade)"/>

  <!-- Inner facet seams for crispness -->
  <g stroke="#0c0a1c" stroke-width="0.4" stroke-opacity="0.6" fill="none">
    <path d="M32 4 L32 32"/>
    <path d="M8 26 L32 32 L56 26"/>
    <path d="M16 50 L32 32 L48 50"/>
    <path d="M32 32 L32 60"/>
  </g>

  <!-- Crystal outline -->
  <path d="M32 4 L56 26 L48 50 L32 60 L16 50 L8 26 Z"
        fill="none" stroke="#0c0a1c" stroke-width="0.8"/>

  <!-- Specular rim along upper-right edge (where light hits) -->
  <path d="M32 5.5 L55 26 L48.3 27"
        fill="none" stroke="#f0f9ff" stroke-width="1.1" stroke-opacity="0.75"
        stroke-linecap="round"/>

  <!-- ─── Atmospheric inner glow around the eye ─── -->
  <ellipse cx="32" cy="32" rx="20" ry="13" fill="url(#a-atmos)"/>

  <!-- ─── Floating light motes (depth cues) ─── -->
  <circle cx="22" cy="22" r="0.7" fill="#e0e7ff" fill-opacity="0.8"/>
  <circle cx="44" cy="42" r="0.5" fill="#c4b5fd" fill-opacity="0.7"/>
  <circle cx="40" cy="22" r="0.4" fill="#fef3c7" fill-opacity="0.6"/>

  <!-- ─── Almond-shaped eye socket (recessed into crystal) ─── -->
  <!-- Outer shadow "lid" ring gives the eye depth inside the crystal -->
  <path d="M14 32 Q32 20 50 32 Q32 44 14 32 Z"
        fill="#09090b" stroke="#1e1b4b" stroke-width="0.6"/>

  <!-- Inner eye recess (slightly lifted) -->
  <path d="M16 32 Q32 22 48 32 Q32 42 16 32 Z"
        fill="#09090b"/>

  <!-- Iris with limbal ring -->
  <circle cx="32" cy="32" r="6.5" fill="url(#a-iris)"/>
  <!-- Iris radial striations -->
  <g stroke="#78350f" stroke-width="0.35" stroke-opacity="0.6" opacity="0.9">
    <line x1="32" y1="26.5" x2="32" y2="37.5"/>
    <line x1="26.5" y1="32" x2="37.5" y2="32"/>
    <line x1="28" y1="28" x2="36" y2="36"/>
    <line x1="36" y1="28" x2="28" y2="36"/>
    <line x1="30" y1="26.7" x2="34" y2="37.3"/>
    <line x1="34" y1="26.7" x2="30" y2="37.3"/>
    <line x1="26.7" y1="30" x2="37.3" y2="34"/>
    <line x1="26.7" y1="34" x2="37.3" y2="30"/>
  </g>

  <!-- Pupil: tall slit with feathered edges (predator/reptilian oracle vibe) -->
  <ellipse cx="32" cy="32" rx="1.2" ry="5.5" fill="#09090b"/>
  <ellipse cx="32" cy="32" rx="0.5" ry="5" fill="#000000"/>

  <!-- Primary catchlight (upper left of pupil) — the lifeline of any eye drawing -->
  <ellipse cx="30.2" cy="29.4" rx="1.3" ry="1.8" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Smaller secondary catchlight -->
  <circle cx="33.5" cy="34" r="0.5" fill="#ffffff" fill-opacity="0.7"/>

  <!-- Soft eyelid shadow across top of eye for further recession -->
  <path d="M14 32 Q32 20 50 32 Q32 28 14 32 Z"
        fill="#000000" fill-opacity="0.35" filter="url(#a-soften)"/>
</svg>
